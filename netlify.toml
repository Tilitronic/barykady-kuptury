# T-023 / D-23: Netlify resolves every path in this file relative to `base`.
# The repository root is the base so the root-level `netlify/functions` stays
# inside base-path resolution (no `../../` traversal). The Quasar app build and
# publish paths are therefore explicit. The install step is required because the
# lockfile lives in the app workspace, not at the repository root.
[build]
  base = "."
  command = "pnpm --dir apps/web/barykadyKultury install --frozen-lockfile && pnpm --dir apps/web/barykadyKultury build"
  publish = "apps/web/barykadyKultury/dist/spa"

[functions]
  directory = "netlify/functions"

# T-042 S9 — public stale-while-revalidate endpoint. Keep it before the SPA
# catch-all; the function returns only metadata (never a source path/secret).
[[redirects]]
  from = "/api/content-check"
  to = "/.netlify/functions/content-check"
  status = 200
  force = true

# Client-side routing: every unknown path resolves to the SPA entry point.
# Netlify evaluates functions before redirects, so the calendar function is not
# shadowed by this catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# T-044/T-034: response-level security headers. The CSP carries the same
# directive set as index.html's production meta policy, plus an explicit
# font-src ('self', semantically equal to the meta's default-src inheritance)
# and frame-ancestors (a meta tag cannot enforce frame-ancestors). The Supabase wildcard is provisional until T-034 pins
# the hosted project origin (D-08); update both the meta and this header
# together. T-041: worker-src must also match the dev meta because the import
# converter runs in a same-origin Vite module worker.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co https://*.googleapis.com; img-src 'self' data: https://*.supabase.co https://*.googleusercontent.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; frame-src https://docs.google.com https://*.google.com; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed build output is content-addressed; cache it forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted font files are stable, versioned by filename when changed.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# T-034: SEO artifacts are regenerated on every deploy from the published route
# list and VITE_SITE_URL (scripts/generate-seo-files.mjs). A one-hour cache
# keeps crawlers fresh without re-reading the file on every hit.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain; charset=utf-8"

# T-034: the manifest is a static brand-asset file; declare its registered type
# so browsers and validators do not receive Netlify's generic fallback.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
