# T-023 / D-23: Netlify resolves every path in this file relative to `base`.
# The repository root is the base so the root-level `netlify/functions` stays
# inside base-path resolution (no `../../` traversal). The Quasar app build and
# publish paths are therefore explicit. The install step is required because the
# lockfile lives in the app workspace, not at the repository root.
[build]
  base = "."
  command = "pnpm --dir apps/web/barykadyKultury install --frozen-lockfile && pnpm --dir apps/web/barykadyKultury build"
  publish = "apps/web/barykadyKultury/dist/spa"

[functions]
  directory = "netlify/functions"

# T-042 S9 — public stale-while-revalidate endpoint. Keep it before the SPA
# catch-all; the function returns only metadata (never a source path/secret).
[[redirects]]
  from = "/api/content-check"
  to = "/.netlify/functions/content-check"
  status = 200
  force = true

# Client-side routing: every unknown path resolves to the SPA entry point.
# Netlify evaluates functions before redirects, so the calendar function is not
# shadowed by this catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# T-044: response-level security headers. The CSP mirrors index.html's meta
# policy (default/script/style/connect/img/font/object/base/form/worker),
# plus frame-ancestors. The Supabase wildcard is provisional until T-034 pins
# the hosted project origin (D-08); update both the meta and this header
# together. T-041: worker-src must also match the dev meta because the import
# converter runs in a same-origin Vite module worker.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data: https://*.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed build output is content-addressed; cache it forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted font files are stable, versioned by filename when changed.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
