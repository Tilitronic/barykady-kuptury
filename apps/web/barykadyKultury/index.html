<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover<% } %>"
    />
    <!--
      CSP baseline: object-src/base-uri/form-action close plugin, <base>-hijack
      and form-redirect vectors. `script-src` allows only the Google Picker
      loader (`apis.google.com`, which pulls gapi modules from `gstatic.com`);
      no other third-party script is permitted. `frame-src` is the Picker's
      Docs iframe. The https://*.supabase.co connect/img source is provisional
      until D-08/T-034 pins the exact hosted project origin. `worker-src 'self'
      blob:` is the T-041 import worker; the same-origin module file is
      preferred, blob is a bundler fallback (keep aligned with netlify.toml).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; frame-src https://docs.google.com https://*.google.com;<% if (ctx.dev) { %> connect-src 'self' ws://localhost:* ws://127.0.0.1:* http://127.0.0.1:54321 http://localhost:54321 https://*.googleapis.com; img-src 'self' data: http://127.0.0.1:54321 http://localhost:54321 https://*.googleusercontent.com;<% } else { %> connect-src 'self' https://*.supabase.co https://*.googleapis.com; img-src 'self' data: https://*.supabase.co https://*.googleusercontent.com;<% } %>"
    />

    <!--
      T-010 no-flash theme bootstrap. A same-origin external script is allowed by
      `script-src 'self'` (no inline script, no CSP hash to maintain) and, being
      a classic parser-blocking <head> script, it sets `[data-theme]` before the
      first paint. See public/theme-init.js for the D-20/CSP rationale.
    -->
    <script src="/theme-init.js"></script>

    <!--
      D-40 (T-007): Preload the latin subset of GNU FreeSerif Regular — the
      above-the-fold primary face of the brand typeface (latin-ext/cyrillic
      and the bold/italic faces are fetched on demand by unicode-range).
      Using a stable /fonts/ path (public/ directory) so the href here and the
      src: url() in typography.css are IDENTICAL — no hash mismatch possible.
      `crossorigin` is required for font preloads even on same-origin to match
      the CORS-enabled font fetch the browser performs when loading the CSS rule.
      The CSP `default-src 'self'` covers same-origin font-src requests without
      an explicit `font-src` directive.
      Binaries are built by `pnpm fonts:build` (hard codepoint gate + woff2
      conversion; GPL-3.0+font-exception provenance in public/fonts/).
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/freeserif-latin-normal.woff2"
      crossorigin
    />

    <!--
      Favicons — brand mark v4 (the REAL brand emblem: SCARLET "B" with
      white interior "BARYKADY KULTURY" lettering, path data byte-identical
      to the supplied logo_red_small.svg). Source of truth:
      src/assets/brand/favicon_mark.svg, copied verbatim to favicon.svg by
      scripts/generate-favicons.mjs (which also rasterises the PNG fallbacks
      and favicon.ico on a transparent canvas; apple-touch-icon is opaque
      white). SVG is the primary icon; PNGs are fallbacks.
      Regenerate: node scripts/generate-favicons.mjs
      Cache-busting: bump ?v=N by 1 each time icons are regenerated and
      deployed (v3 -> v4 with the real-emblem correction).
      Fix1: sizes="any" on the SVG link signals scalable size to all browsers.
    -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg?v=4" />
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="icons/favicon-128x128.png?v=4"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="icons/favicon-96x96.png?v=4"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png?v=4"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png?v=4"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=4" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="icons/apple-icon-180x180.png?v=4"
    />

    <!--
      T-034 web app manifest. Brand colours are the verified D-13 tokens
      (SCARLET #C60001 / GRAY93 #EDEDED); icons are the existing brand-asset
      rasterisations (scripts/generate-favicons.mjs), so the manifest adds no
      new image source. `display: browser` is deliberate: V1 has no service
      worker or offline requirement, so claiming `standalone` would overpromise.
      `start_url` stays `/` because the root route applies the locale preference.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
