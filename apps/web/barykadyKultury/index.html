<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover<% } %>"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';<% if (ctx.dev) { %> connect-src 'self' ws://localhost:* ws://127.0.0.1:* http://127.0.0.1:54321 http://localhost:54321; img-src 'self' data: http://127.0.0.1:54321 http://localhost:54321; worker-src 'self' blob:;<% } else { %> connect-src 'self' https://*.supabase.co; img-src 'self' data: https://*.supabase.co;<% } %>"
    />

    <!--
      T-010 no-flash theme bootstrap. A same-origin external script is allowed by
      `script-src 'self'` (no inline script, no CSP hash to maintain) and, being
      a classic parser-blocking <head> script, it sets `[data-theme]` before the
      first paint. See public/theme-init.js for the D-20/CSP rationale.
    -->
    <script src="/theme-init.js"></script>

    <!--
      T-007: Preload the latin subset of Inter Variable (the primary weight file).
      Using a stable /fonts/ path (public/ directory) so the href here and the
      src: url() in typography.css are IDENTICAL — no hash mismatch possible.
      `crossorigin` is required for font preloads even on same-origin to match
      the CORS-enabled font fetch the browser performs when loading the CSS rule.
      The CSP `default-src 'self'` covers same-origin font-src requests without
      an explicit `font-src` directive.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin-wght-normal.woff2"
      crossorigin
    />

    <!--
      Favicons — brand mark v4 (the REAL brand emblem: SCARLET "B" with
      white interior "BARYKADY KULTURY" lettering, path data byte-identical
      to the supplied logo_red_small.svg). Source of truth:
      src/assets/brand/favicon_mark.svg, copied verbatim to favicon.svg by
      scripts/generate-favicons.mjs (which also rasterises the PNG fallbacks
      and favicon.ico on a transparent canvas; apple-touch-icon is opaque
      white). SVG is the primary icon; PNGs are fallbacks.
      Regenerate: node scripts/generate-favicons.mjs
      Cache-busting: bump ?v=N by 1 each time icons are regenerated and
      deployed (v3 -> v4 with the real-emblem correction).
      Fix1: sizes="any" on the SVG link signals scalable size to all browsers.
    -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg?v=4" />
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="icons/favicon-128x128.png?v=4"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="icons/favicon-96x96.png?v=4"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png?v=4"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png?v=4"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=4" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="icons/apple-icon-180x180.png?v=4"
    />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
